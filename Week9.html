<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>被改寫的圓桌・第八點五週：真實的 Anna</title>
<style>
:root{--bg:#0e1114;--fg:#d8dde0;--dim:#7d8890;--acc:#7fb4c7;--line:#2c353b}
*{box-sizing:border-box}
html,body{margin:0;background:#0e1114}
body{color:var(--fg);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.95;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
h1{font-size:1.15rem;font-weight:600;letter-spacing:.22em;text-align:center;margin:28px 0 2px}
.sub{text-align:center;color:var(--acc);font-size:.9rem;letter-spacing:.3em;margin:0 0 18px}
button,a{font:inherit}button{cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.letter{margin:10px 0 18px;padding:26px 22px;background:linear-gradient(160deg,#e8dfc9,#d8cdb2);color:#2b2418;box-shadow:inset 0 0 36px #7a5e2a55,0 0 24px #0009;border-radius:2px}
.letter p{margin:0 0 1.1em;opacity:0;animation:rise 1.1s forwards}
.letter .last{margin-bottom:0}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.pick{opacity:0;animation:rise 1.2s forwards;text-align:center}
.bottles{display:flex;gap:20px;justify-content:center;margin:14px 0 6px}
.bottle{width:104px;padding:12px 6px;background:#161b1f;border:1px solid var(--line);border-radius:10px;color:var(--fg);letter-spacing:.3em}
.bottle:hover,.bottle:focus-visible{border-color:var(--acc)}
.bottle svg{width:56px;height:92px;display:block;margin:0 auto 6px}
.soft{color:var(--dim);font-size:.85rem;margin:6px 0 28px}
.res{margin:10px 0 24px;padding:24px 20px;border:1px solid var(--line);background:#12171b;animation:rise 1.2s both}
.res.blue{border-color:#3b6fd0aa;box-shadow:0 0 28px #3b6fd022}
.res.red{border-color:#c4473faa;box-shadow:0 0 28px #c4473f22}
.res p{margin:0 0 1em;white-space:pre-line}
.share{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.9rem}
.share a{color:var(--acc);word-break:break-all}
.cp{display:block;width:100%;margin-top:12px;padding:12px;background:transparent;border:1px solid var(--acc);color:var(--acc);letter-spacing:.3em}
.back{display:block;margin:0 auto 40px;background:none;border:0;color:var(--dim);text-decoration:underline;padding:8px}
</style>
</head>
<body>
<h1>被改寫的圓桌</h1>
<p class="sub">真實的 Anna・這是一封信</p>
<div class="letter" id="letter"></div>
<div class="pick" id="pick" style="display:none"></div>
<div id="out"></div>

<script>
// ===== 這一頁只需改這一區 =====
const GAP = 1.4; // 信的每一段淡入的間隔（秒）
const LETTER = [
 '我想了很久，還是寄出了這封信。',
 '事實上，我在寫故事的時候，我想的就是告訴你，從我的視角看見的你，到底長什麼樣子。\n螢幕前的你，我決定，還是跨出這一步吧。',
 '其實，我喜歡你很久了。\n好幾次，我都打了退堂鼓。',
 '我在軍中這幾天，才發現，原來我已經習慣了每天都有你在的日子。\n雖然我曾經覺得你很吵、很煩人，但是在軍中那個沒有手機、都是棒子的人群裡，我發現，還是只有你，能夠讓我放心的把自己交出去。',
 '但如果你拒絕了，我也不會難過。\n我們的副排長曾經說過，那都只是一個選擇而已，沒有人可以勉強你。',
 '放心，不管你按了同意或是拒絕，我都還是會繼續當你的寵物，陪著你組團。',
 '所以，如果你願意，你可以選擇藍藥水。\n如果你仍然不跨過這一條線，你可以選擇紅藥水。'
];
const SOFT = '不用急著選。你可以先關掉這一頁，之後再回來。';
const RESULT = {
 blue:{name:'藍',color:'#3b6fd0',link:'https://reurl.cc/zOaWNp',p:[
  '我沒有想過，你會選擇這個答案。\n我時常在腦中演練你拒絕的日子，我時常提醒自己，不要往這方面想。很多時候載著你回家後，我常常一個人亂飆車，所以才會發生我車禍飛進樹林的事情。那個時候我故意說自己 EMO，是因為不希望你去猜測這件事情。',
  '如今你選擇了同意，那麼接下來，我不只是你的寵物，而是必須要陪伴你的圓桌武士。就像我說過的：美好的事情，不會發生，但我們能夠自己去創造。',
  '還記得那次，我們跑去忘憂谷嗎？雖然我們沒能找到藏在停車場的一千塊，但是我們跑了一整天，那個過程，我至今還記得。',
  '總之，下半輩子，就請你和我，好好的活著吧！',
  '然後，請把這個連結複製，丟進群組，我們就知道了。']},
 red:{name:'紅',color:'#c4473f',link:'https://reurl.cc/Vnx58N',p:[
  '雖然我內心已經演練這個結果千百遍，我也能夠安靜的放下自己，去接受這個結果。因為你的答覆，可以讓我放下心，去放逐自己，不要再等待任何事情發生。',
  '但跟你約定的組團那些，我仍然還會在，只是我接受了現實而已。當然，我覺得你應該多多少少都有看得出來了吧！',
  '沒有關係，我沒事的。該請你的，我仍然都會請你吃飯那些的。',
  '把這個連結，丟到群組吧。']}
};
// ===== 以下為程式 =====
const $=id=>document.getElementById(id);
const BOTTLE=c=>'<svg viewBox="0 0 60 100" aria-hidden="true"><rect x="23" y="4" width="14" height="10" rx="2" fill="#7a5a34"/><rect x="26" y="14" width="8" height="16" fill="#c9d6d2"/><path d="M26 30Q6 44 8 74Q10 94 30 94Q50 94 52 74Q54 44 34 30Z" fill="'+c+'" stroke="#c9d6d2" stroke-width="2.5"/><path d="M18 60Q19 50 25 46" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/></svg>';
function build(){
 const L=$('letter');
 LETTER.forEach((t,i)=>{const p=document.createElement('p');p.textContent=t;p.style.whiteSpace='pre-line';p.style.animationDelay=(i*GAP+.3)+'s';if(i===LETTER.length-1)p.className='last';L.appendChild(p)});
 const pk=$('pick');pk.style.animationDelay=(LETTER.length*GAP+.6)+'s';pk.style.display='block';
 const d=document.createElement('div');d.className='bottles';
 ['blue','red'].forEach(k=>{const R=RESULT[k],b=document.createElement('button');b.className='bottle';b.innerHTML=BOTTLE(R.color)+R.name;b.setAttribute('aria-label',R.name+'藥水');b.onclick=()=>show(k);d.appendChild(b)});
 const s=document.createElement('div');s.className='soft';s.textContent=SOFT;
 pk.append(d,s);
}
function show(k){
 const R=RESULT[k],o=$('out');o.innerHTML='';
 const d=document.createElement('div');d.className='res '+k;
 R.p.forEach(t=>{const p=document.createElement('p');p.textContent=t;d.appendChild(p)});
 const sh=document.createElement('div');sh.className='share';
 const a=document.createElement('a');a.href=R.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=R.link;
 const cp=document.createElement('button');cp.className='cp';cp.textContent='複製連結';
 cp.onclick=async()=>{try{await navigator.clipboard.writeText(R.link);cp.textContent='已複製'}catch(e){const t=document.createElement('textarea');t.value=R.link;document.body.appendChild(t);t.select();try{document.execCommand('copy');cp.textContent='已複製'}catch(x){cp.textContent='請長按上面的連結複製'}t.remove()}};
 sh.append(a,cp);d.appendChild(sh);o.appendChild(d);
 const bk=document.createElement('button');bk.className='back';bk.textContent='回到信';bk.onclick=()=>{o.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})};o.appendChild(bk);
 d.scrollIntoView({behavior:'smooth',block:'start'});
}
build();
// 這一頁刻意不記錄任何選擇；回應由對方自己決定要不要給你。
</script>
</body>
</html>
