<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>被改寫的圓桌・第六週：第三封印</title>
<style>
:root{--bg:#16181a;--slate:#24272a;--slate2:#2e3236;--bone:#ddd5c2;--dim:#8c8a80;--bronze:#b08a4a;--verd:#6aa396;--red:#b55a4a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.8}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
h1{font-size:1.2rem;font-weight:600;letter-spacing:.25em;text-align:center;margin:28px 0 2px}
.sub{text-align:center;color:var(--bronze);font-size:.9rem;letter-spacing:.3em;margin:0 0 8px}
.intro{border-left:2px solid var(--bronze);padding:2px 14px;margin:10px 0 14px;font-size:.92rem}.intro p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,summary:focus-visible{outline:2px solid var(--verd);outline-offset:2px}
.modes{display:flex;gap:8px;margin:12px 0 10px}
.modes button{flex:1;padding:12px;background:var(--slate);border:1px solid #3a3f44;letter-spacing:.2em}
.modes button.on{border-color:var(--bronze);color:var(--bronze);background:#2b2e31}
.scene{position:relative;width:min(86vw,360px);aspect-ratio:1;margin:0 auto}
.scene svg{width:100%;height:100%;display:block;border:1px solid #3a3f44}
.hot{position:absolute;background:none;border:0;border-radius:6px}
.hot:hover{background:#ffffff0d}
.tip{text-align:center;color:var(--dim);font-size:.82rem;margin:8px 0 4px;min-height:1.6em}
.rings{display:flex;gap:8px;justify-content:center;margin:14px 0}
.col{display:flex;flex-direction:column;gap:4px;width:64px}
.arr{height:38px;background:var(--slate2);border:1px solid #3f444a;color:var(--dim)}
.rg{height:92px;display:grid;place-items:center;background:linear-gradient(160deg,#3a3e42,#25282b);border:1px solid #555b61;border-radius:8px;box-shadow:inset 0 0 16px #000a}
.rg svg{width:50%;height:62px;fill:none;stroke:var(--bone);stroke-width:3.4;stroke-linecap:square;stroke-linejoin:miter;transition:stroke .6s}
.rings.ok .rg svg{stroke:var(--verd)}
.row{display:flex;gap:10px;margin:14px 0}
.act{flex:1;padding:12px;background:transparent;border:1px solid var(--bronze);letter-spacing:.2em}
.act.main{background:var(--bronze);color:#16181a}
details{margin:6px 0 14px;border:1px solid #3a3f44;padding:6px 12px;font-size:.85rem;color:var(--dim)}
summary{cursor:pointer;padding:6px 0}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.chart div{text-align:center;background:var(--slate);padding:4px 0}
.chart svg{width:18px;height:34px;fill:none;stroke:var(--bone);stroke-width:3;stroke-linecap:square;stroke-linejoin:miter;display:block;margin:0 auto}
.chart span{font-size:.75rem;color:var(--bronze)}
.res{margin:18px 0 40px;padding:24px 20px;background:linear-gradient(160deg,#2c2f32,#202326);border:1px solid #444a50;box-shadow:inset 0 0 40px #0008}
.res p{margin:0 0 1em;white-space:pre-line;opacity:0;animation:rise .9s forwards}
.res .t{font-size:.8rem;letter-spacing:.2em;opacity:1;animation:none;color:var(--verd)}
.res .q{border-left:2px solid var(--dim);padding-left:12px;color:#e9e1cc}
.res .note{color:var(--bronze);border-top:1px solid #444a50;padding-top:14px}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.code{margin-top:18px;text-align:center;opacity:0;animation:rise 1.2s forwards}.code small{display:block;color:var(--dim);font-size:.78rem;letter-spacing:.2em}.code b{display:block;color:var(--bronze);font-size:1.8rem;letter-spacing:.35em;user-select:all;-webkit-user-select:all}
#pop{position:fixed;inset:0;z-index:99;background:#000c;display:flex;align-items:center;justify-content:center;padding:24px;animation:rise .6s both}
#pop .card{max-width:440px;width:100%;padding:26px 22px;background:linear-gradient(160deg,#2c2f32,#202326);border:1px solid var(--bronze)}
#pop .m{white-space:pre-line;font-size:1rem;line-height:2}
#pop .f{color:var(--dim);font-size:.85rem;margin-top:12px;white-space:pre-line}
#pop button{display:block;margin:20px auto 0;padding:10px 28px;background:transparent;border:1px solid var(--bronze);letter-spacing:.3em}
#admin{display:none;font-size:.78rem;color:var(--dim);margin-bottom:40px}
#admin table{width:100%;border-collapse:collapse}#admin td,#admin th{border-bottom:1px solid #333;padding:3px 4px;text-align:left;vertical-align:top}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<h1>被改寫的圓桌</h1>
<p class="sub">第六週・第三封印</p>
<div class="intro"><p>石頭還立在原地。<br>前面放著一只小瓶，後面似乎有什麼在動。</p></div>

<div class="modes"><button id="mF" class="on">石頭前面</button><button id="mB">石頭後面</button></div>

<div id="pF">
 <div class="scene">
  <svg viewBox="0 0 300 300" aria-label="插著劍的石頭，旁邊有一只小瓶">
   <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="300"><stop offset="0" stop-color="#0d1214"/><stop offset=".5" stop-color="#1b2326"/><stop offset="1" stop-color="#2d3a38"/></linearGradient></defs>
   <rect width="300" height="300" fill="url(#g)"/>
   <circle cx="248" cy="46" r="20" fill="#e6e1c9" opacity=".85"/>
   <path d="M0 262 Q60 246 120 262 T240 262 T300 258 V300 H0Z" fill="#0f1a16"/>
   <circle cx="150" cy="16" r="7" fill="#b08a4a"/><rect x="146" y="22" width="8" height="22" fill="#6b4a2a"/><rect x="118" y="44" width="64" height="9" rx="2" fill="#b08a4a"/><rect x="144" y="53" width="12" height="70" fill="#d0d4d8"/>
   <path d="M70 262 L80 170 L110 130 L150 118 L195 130 L225 172 L236 262Z" fill="#555b60" stroke="#2b2f33" stroke-width="3"/>
   <path d="M42 270 Q42 252 56 252 Q70 252 70 270Z" fill="#6aa396" opacity=".85"/><rect x="52" y="240" width="8" height="12" fill="#c9d6d2"/>
   <ellipse id="peb" cx="258" cy="272" rx="11" ry="6" fill="#4a4f54"/>
  </svg>
  <button class="hot" id="vial" style="left:9%;top:76%;width:19%;height:16%" aria-label="拿起小瓶"></button>
  <button class="hot" id="pebble" style="left:79%;top:87%;width:14%;height:9%;display:none" aria-label="一顆小石子"></button>
 </div>
 <div class="tip">試著碰一碰石頭前面的東西。</div>
</div>

<div id="pB" style="display:none">
 <div class="tip">石頭背後有一圈環輪，刻著符文。</div>
 <div class="rings" id="rings"></div>
 <div class="row"><button class="act main" id="go">轉動機關</button></div>
 <details><summary>梅林的符文對照表</summary><div class="chart" id="chart"></div></details>
</div>

<div class="row"><button class="act" id="reset">重置</button></div>
<div id="out"></div>

<div id="admin"><p>後台紀錄（僅此瀏覽器）</p><div class="row"><button class="act" id="exp">匯出 CSV</button><button class="act" id="clr">清空</button></div><table id="logtbl"></table></div>

<script>
// ===== 每週只需改這一區 =====
const WEEK = 6;
const ENDPOINT = ""; // 選填：Google Apps Script / Formspree 網址
const CODES = {mech:'', vial:''}; // 選填：解完後要貼到群組的數字（留空就不顯示）
const KEY_WORD = 'ANNA'; // 環輪要拼出的名字（用符文）
// 第三條線：點石頭前面右下角的小石子，會跳出這段話。
// 留空 ('') 就完全不會出現，小石子也不會有任何反應。
const MSG = '';
const MSG_FOOT = ''; // 選填：訊息下方的小字，例如不需要回覆的說明
const STORY = {
 mech:{t:'石中劍的背後',p:[
  ['你繞到石頭後面。四枚環輪對上了她的名字，石面無聲地向內滑開。\n裡面藏著一塊薄薄的石板，刻痕很舊，卻很整齊。'],
  ['石板上記載著：\n曾有一個貌美的人，因為別人嫉妒她的美，被詛咒了。她的頭髮被變成一把劍，插進了石頭裡。\n詛咒只留下一個條件：唯有拔出這把劍的人，才能成為她復仇的旗子。','q'],
  ['石板的最後一行字，刻得很深：\n「破解的方法，是找到梅林。」','note']]},
 vial:{t:'瓶中的解藥',p:[
  ['你把小瓶舉到光下。瓶底有一行極小的刻字，是梅林的記號。\n這瓶解藥，是他親手煉製的。'],
  ['史書上沒有寫的是：煉成的那一天，梅林也正式成了亞瑟王懷疑的對象。','q'],
  ['留下這瓶藥劑之後，梅林便不知所蹤。'],
  ['但在很遠很遠的地方，有人一直看著這一切。\n看著 John，看著 Anna，也看著你。','note']]}
};
// 24 個盧恩符文（與第二週相同）
const R=[['F','M8 4V36M8 14L18 6M8 24L18 16'],['U','M6 4V36M6 4L16 14V36'],['TH','M8 4V36M8 12L18 20L8 28'],['A','M8 4V36M8 6L18 14M8 16L18 24'],['R','M8 4V36M8 4L18 12L8 20L18 36'],['C','M16 10L6 20L16 30'],['G','M4 8L16 32M16 8L4 32'],['W','M8 4V36M8 4L18 12L8 20'],['H','M5 4V36M15 4V36M5 14L15 26'],['N','M10 4V36M4 14L16 24'],['I','M10 4V36'],['J','M13 6L6 13L13 20M7 22L14 29L7 36'],['EI','M10 4V36M10 4L4 12M10 36L16 28'],['P','M6 36V4H16V18H6'],['Z','M10 36V4M10 20L3 10M10 20L17 10'],['S','M14 4L6 16L14 22L6 34'],['T','M10 36V4M10 4L3 14M10 4L17 14'],['B','M6 4V36M6 4L15 12L6 20L15 28L6 36'],['E','M5 4V36M15 4V36M5 4L10 14L15 4'],['M','M5 4V36M15 4V36M5 4L15 20M15 4L5 20'],['L','M6 36V4M6 4L16 14'],['NG','M10 6L16 20L10 34L4 20Z'],['D','M5 4V36M15 4V36M5 4L15 36M15 4L5 36'],['O','M10 4L16 12L10 20L4 12ZM10 20L5 36M10 20L15 36']];
// ===== 以下為程式 =====
const $=id=>document.getElementById(id);
const svg=(d)=>'<svg viewBox="0 0 20 40" aria-hidden="true"><path d="'+d+'"/></svg>';
const N=KEY_WORD.length,idx=Array(N).fill(0);
let doneM=false,doneV=false;
function build(){
 const w=$('rings');w.innerHTML='';
 for(let i=0;i<N;i++){const c=document.createElement('div');c.className='col';
  const u=document.createElement('button');u.className='arr';u.textContent='▲';u.setAttribute('aria-label','上一個符文');u.onclick=()=>step(i,-1);
  const g=document.createElement('div');g.className='rg';g.id='r'+i;
  const d=document.createElement('button');d.className='arr';d.textContent='▼';d.setAttribute('aria-label','下一個符文');d.onclick=()=>step(i,1);
  c.append(u,g,d);w.appendChild(c)}
 $('chart').innerHTML=R.map(r=>'<div>'+svg(r[1])+'<span>'+r[0]+'</span></div>').join('');
 draw();
 if(MSG)$('pebble').style.display='block';
}
function draw(){for(let i=0;i<N;i++)$('r'+i).innerHTML=svg(R[idx[i]][1]);$('rings').classList.toggle('ok',doneM)}
function step(i,d){if(doneM)return;idx[i]=(idx[i]+d+R.length)%R.length;draw()}
function show(k){
 const S=STORY[k],o=$('out');o.innerHTML='';
 const d=document.createElement('div');d.className='res';d.innerHTML='<p class="t">'+S.t+'</p>';
 S.p.forEach((x,i)=>{const p=document.createElement('p');p.textContent=x[0];if(x[1])p.className=x[1];p.style.animationDelay=(i*1.3+.4)+'s';d.appendChild(p)});
 if(CODES[k]){const c=document.createElement('div');c.className='code';c.style.animationDelay=(S.p.length*1.3+.8)+'s';c.innerHTML='<small>把這組數字傳到群組</small><b>'+CODES[k]+'</b>';d.appendChild(c)}
 o.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'start'});
}
function setMode(m){
 $('mF').classList.toggle('on',m==='F');$('mB').classList.toggle('on',m==='B');
 $('pF').style.display=m==='F'?'block':'none';$('pB').style.display=m==='B'?'block':'none';
}
$('mF').onclick=()=>setMode('F');$('mB').onclick=()=>setMode('B');
$('vial').onclick=()=>{doneV=true;show('vial');log('vial','vial')};
$('go').onclick=()=>{
 const w=idx.map(i=>R[i][0]).join('');
 if(w===KEY_WORD){doneM=true;draw();show('mech');log(w,'mech-open')}
 else{$('pB').querySelector('.tip').textContent='機關沒有反應。';log(w,'mech-wrong')}
};
// 第三條線：不記錄內容，也不要求回應
$('pebble').onclick=()=>{
 if(!MSG||$('pop'))return;
 const L=document.createElement('div');L.id='pop';L.setAttribute('role','dialog');L.setAttribute('aria-modal','true');
 const c=document.createElement('div');c.className='card';
 const m=document.createElement('div');m.className='m';m.textContent=MSG;c.appendChild(m);
 if(MSG_FOOT){const f=document.createElement('div');f.className='f';f.textContent=MSG_FOOT;c.appendChild(f)}
 const b=document.createElement('button');b.textContent='關上';b.onclick=()=>L.remove();c.appendChild(b);
 L.appendChild(c);document.body.appendChild(L);b.focus();
};
$('reset').onclick=()=>{idx.fill(0);doneM=false;doneV=false;$('out').innerHTML='';$('pB').querySelector('.tip').textContent='石頭背後有一圈環輪，刻著符文。';draw()};
// ---- 紀錄 ----
const LK='libra_log';
const getLog=()=>{try{return JSON.parse(localStorage.getItem(LK)||'[]')}catch(e){return[]}};
function log(input,state){
 const e={week:WEEK,time:new Date().toISOString(),input,state};
 try{const a=getLog();a.push(e);localStorage.setItem(LK,JSON.stringify(a))}catch(x){}
 if(ENDPOINT){try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(e)})}catch(x){}}
 drawLog();
}
const det=e=>e.input!==undefined?e.input:((e.left||[]).join('+')+' | '+(e.right||[]).join('+'));
function drawLog(){
 $('logtbl').innerHTML='<tr><th>時間</th><th>週</th><th>輸入</th><th>狀態</th></tr>'+getLog().slice().reverse().map(e=>'<tr><td>'+e.time.slice(5,16).replace('T',' ')+'</td><td>'+e.week+'</td><td>'+det(e)+'</td><td>'+e.state+'</td></tr>').join('');
}
$('exp').onclick=()=>{const csv='week,time,input,state\n'+getLog().map(e=>[e.week,e.time,'"'+det(e)+'"',e.state].join(',')).join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='libra_log.csv';l.click()};
$('clr').onclick=()=>{if(confirm('清空此瀏覽器的紀錄？')){localStorage.removeItem(LK);drawLog()}};
if(location.hash==='#admin'){$('admin').style.display='block';drawLog()}
build();
</script>
</body>
</html>
