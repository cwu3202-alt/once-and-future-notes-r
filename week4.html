<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>被改寫的圓桌・第四週：第一封印</title>
<style>
:root{--bg:#16181a;--slate:#24272a;--slate2:#2e3236;--bone:#ddd5c2;--dim:#8c8a80;--bronze:#b08a4a;--verd:#6aa396;--red:#b55a4a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.8}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
h1{font-size:1.2rem;font-weight:600;letter-spacing:.25em;text-align:center;margin:28px 0 2px}
.sub{text-align:center;color:var(--bronze);font-size:.9rem;letter-spacing:.3em;margin:0 0 8px}
.intro{border-left:2px solid var(--bronze);padding:2px 14px;margin:10px 0 14px;font-size:.92rem}.intro p{margin:.4em 0}
.lbl{font-size:.8rem;color:var(--dim);margin:16px 0 6px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--verd);outline-offset:2px}
.trees{display:flex;gap:8px}
.trees button{flex:1;padding:10px 2px;background:var(--slate);border:1px solid #3a3f44;line-height:1.4;font-size:.95rem}
.trees button small{display:block;color:var(--dim);font-size:.72rem;letter-spacing:.1em}
.trees button.on{border-color:var(--bronze);color:var(--bronze)}
.hint{margin:10px 0 4px;padding:14px;border:1px solid #3a3f44;background:#1b1d1f;font-size:.9rem;animation:rise .8s}
.hint .m{color:var(--dim);margin:0 0 6px;white-space:pre-line}
.hint .n{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.5rem;letter-spacing:.2em;text-align:center;color:var(--bronze);margin:8px 0 2px}
.hint .d{text-align:center;color:var(--dim);font-size:.8rem;margin:0}
.hint button{display:block;margin:10px auto 0;padding:6px 18px;background:none;border:1px solid var(--bronze);color:var(--bronze);font-size:.85rem}
.seal{width:min(70vw,250px);margin:10px auto}
.seal svg{width:100%;height:auto;fill:none;stroke:var(--bronze);stroke-width:2;transition:transform 2s cubic-bezier(.3,1.4,.5,1),stroke .8s,filter .8s}
.seal.open svg{transform:rotate(75deg) scale(1.06);stroke:var(--verd);filter:drop-shadow(0 0 10px #6aa396aa)}
.seal.shut svg{transform:rotate(-75deg) scale(.92);stroke:var(--red);filter:drop-shadow(0 0 10px #b55a4a88)}
.dials{display:flex;gap:8px;justify-content:center}
.dials input{width:30%;min-width:0;text-align:center;padding:14px 4px;font-size:1.6rem;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--bronze);background:linear-gradient(160deg,#3a3e42,#25282b);border:1px solid #555b61;border-radius:6px;box-shadow:inset 0 0 14px #000a}
.ins{width:100%;margin-top:8px;padding:12px;text-align:center;font-size:1.1rem;letter-spacing:.3em;background:var(--slate);border:1px solid #3f444a;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.btns{display:flex;gap:10px;margin:14px 0}
.act{flex:1;padding:12px;background:transparent;border:1px solid var(--bronze);letter-spacing:.2em}
.act.main{background:var(--bronze);color:#16181a}
.res{margin:18px 0 40px;padding:24px 20px;background:linear-gradient(160deg,#2c2f32,#202326);border:1px solid #444a50;box-shadow:inset 0 0 40px #0008}
.res p{margin:0 0 1em;white-space:pre-line;opacity:0;animation:rise .9s forwards}
.res .t{font-size:.8rem;letter-spacing:.2em;opacity:1;animation:none;color:var(--verd)}
.res.shut .t{color:var(--red)}
.res .q{border-left:2px solid var(--dim);padding-left:12px;color:#e9e1cc}
.res .note{color:var(--bronze);border-top:1px solid #444a50;padding-top:14px}
.res.shut{border-color:#6b3a32}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.code{margin-top:18px;text-align:center;opacity:0;animation:rise 1.2s forwards}.code small{display:block;color:var(--dim);font-size:.78rem;letter-spacing:.2em}.code b{display:block;color:var(--bronze);font-size:1.8rem;letter-spacing:.35em;user-select:all;-webkit-user-select:all}
#egg{position:fixed;inset:0;z-index:99;background:#0b0c0d;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:rise .4s both}
#egg .e1{font-size:1.7rem;font-weight:700;letter-spacing:.08em;line-height:1.6;animation:gl .7s steps(2) infinite}
@keyframes gl{25%{transform:translate(2px,0);text-shadow:-2px 0 #6aa396}50%{transform:translate(-2px,1px);text-shadow:2px 0 #b08a4a}75%{transform:translate(1px,-1px)}}
#admin{display:none;font-size:.78rem;color:var(--dim);margin-bottom:40px}
#admin table{width:100%;border-collapse:collapse}#admin td,#admin th{border-bottom:1px solid #333;padding:3px 4px;text-align:left;vertical-align:top}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<h1>被改寫的圓桌</h1>
<p class="sub">第四週・第一封印</p>
<div class="intro">
<p>梅林筆記的最底層，壓著一道封印。</p>
<p>你在第三週走進了一棵樹。<br>① 點下面那棵樹，殘頁會浮現一組數字。<br>② 把數字撥進三個轉輪。<br>③ 封印上的刻文，要向身邊的人打聽。</p>
</div>

<div class="lbl">第三週走過的路（點一棵樹）</div>
<div class="trees" id="trees"></div>
<div class="hint" id="hint" style="display:none"></div>

<div class="seal" id="seal">
 <svg viewBox="0 0 200 200" aria-hidden="true">
  <circle cx="100" cy="100" r="94"/><circle cx="100" cy="100" r="76"/><circle cx="100" cy="100" r="34"/>
  <path d="M100 6V24M100 176V194M6 100H24M176 100H194M33 33L46 46M154 154L167 167M167 33L154 46M46 154L33 167"/>
  <path d="M100 70L112 94L100 130L88 94Z M100 70V54"/>
 </svg>
</div>

<div class="lbl">三個轉輪</div>
<div class="dials">
 <input id="d1" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="・" aria-label="第一個轉輪" autocomplete="off">
 <input id="d2" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="・" aria-label="第二個轉輪" autocomplete="off">
 <input id="d3" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="・" aria-label="第三個轉輪" autocomplete="off">
</div>
<div class="lbl">封印上的刻文</div>
<input class="ins" id="ins" type="text" maxlength="12" placeholder="＿＿＿＿" autocomplete="off" autocapitalize="characters" spellcheck="false">
<div class="btns"><button class="act" id="reset">重置</button><button class="act main" id="go">施加封印</button></div>

<div id="out"></div>

<div id="admin"><p>後台紀錄（僅此瀏覽器）</p><div class="btns"><button class="act" id="exp">匯出 CSV</button><button class="act" id="clr">清空</button></div><table id="logtbl"></table></div>

<script>
// ===== 每週只需改這一區 =====
const WEEK = 4;
const ENDPOINT = ""; // 選填：Google Apps Script / Formspree 網址
const CODES = {open:'', shut:'', egg:''}; // 選填：解完後要貼到群組的數字（留空就不顯示）
// 轉輪與刻文：順著轉是「解開」，倒著轉是「鎖上」。兩者的刻文相同。
const INSCRIPTIONS = ['2B2C','2BFC']; // 這兩個都接受（避免你原本想的是 2BFC 還是 2B2C）
const OPEN = [8,257,2];
const SHUT = [2,257,8];
// 第三週三棵樹：點開後給一組數字（橡樹＝順著撥、樺樹＝倒著撥、紫杉＝糊掉的字跡）
const TREES = {
 oak:  {icon:'🌳',name:'橡樹',en:'OAK',  m:'「不是被魔法魅惑，而是心甘情願的臣服。」', n:[8,257,2],  d:'殘頁寫著：順著撥，封印會裂開。'},
 birch:{icon:'🌿',name:'樺樹',en:'BIRCH',m:'「她拒絕成為無名的犧牲品。」',             n:[2,257,8],  d:'殘頁寫著：倒著撥，封印會鎖上。'},
 yew:  {icon:'🌲',name:'紫杉',en:'YEW',  m:'「世人畏懼無法理解的力量。」',             n:null,       d:'殘頁上的數字被墨水糊成一團，而且一直在變。'}
};
const EGG_LINE = '幹我什麼時候才會被驗退';
const STORY = {
 open:{t:'第一封印・裂開',cls:'open',p:[
  ['封印在你掌心裂開，發出一聲像是嘆息的脆響。\n筆記最底層的夾頁終於顯露：一份被火燒去半邊的審判記錄。'],
  ['史官寫道：「Anna，女妖。以歌聲與低語誘人墮落。」\nJohn 曾在月夜親眼看見她的影子長出不屬於人類的形狀。'],
  ['但梅林在頁邊用顫抖的筆跡寫下了真相：\n「她確實不是人類。可是被詛咒的，從來不是她。\n詛咒的源頭是 John 自己。凡是他想守護的人，終將被世人當成怪物。\nAnna 不是來蠱惑他的。她是第一個看見詛咒，卻沒有逃走的人。」','q'],
  ['梅林筆記：\n「第一封印封住的不是女妖，而是他不敢承認的事。」','note']]},
 shut:{t:'第一封印・鎖上',cls:'shut',p:[
  ['你把轉輪倒著撥回。封印沒有裂開，反而發出了鎖上的聲音。\n筆記自己翻到另一章，墨跡還是濕的。'],
  ['John 在月夜裡看見了 Anna 真正的樣子：女妖。\n他拔出劍，開始追殺她，一路追進卡美洛特的地下聖堂。'],
  ['Anna 沒有反抗。她用第一封印把自己鎖進結界，只留下一道縫。\n透過那道縫，她用低語對他說：\n「你要殺的是我。但你真正恨的，是那個命令你的人。」','q'],
  ['John 放下了劍。三天後，他走向國王的寢宮。'],
  ['梅林筆記：\n「封印鎖住了女妖，卻放出了她的聲音。史書上那個刺殺國王的人，從來不是自己走進去的。」','note']]}
};
// ===== 以下為程式 =====
const $=id=>document.getElementById(id);
const eq=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
function norm(s){return s.toUpperCase().replace(/[\s\-_・]/g,'')}
function show(k){
 const S=STORY[k],o=$('out');o.innerHTML='';
 const d=document.createElement('div');d.className='res '+S.cls;d.innerHTML='<p class="t">'+S.t+'</p>';
 S.p.forEach((x,i)=>{const p=document.createElement('p');p.textContent=x[0];if(x[1])p.className=x[1];p.style.animationDelay=(i*1.3+.4)+'s';d.appendChild(p)});
 if(CODES[k]){const c=document.createElement('div');c.className='code';c.style.animationDelay=(S.p.length*1.3+.8)+'s';c.innerHTML='<small>把這組數字傳到群組</small><b>'+CODES[k]+'</b>';d.appendChild(c)}
 o.appendChild(d);
 $('seal').className='seal '+k;
}
function egg(){
 if($('egg'))return;
 const L=document.createElement('div');L.id='egg';L.setAttribute('role','alert');
 L.innerHTML='<div class="e1"></div>'+(CODES.egg?'<div class="code" style="animation-delay:2s"><small>把這組數字傳到群組</small><b>'+CODES.egg+'</b></div>':'');
 L.firstChild.textContent=EGG_LINE;
 document.body.appendChild(L);
 [...document.body.children].forEach(c=>{if(c!==L&&c.tagName!=='SCRIPT')c.inert=true});
}
$('go').onclick=()=>{
 const nums=['d1','d2','d3'].map(i=>parseInt($(i).value,10));
 const ins=norm($('ins').value),inp=nums.map(n=>isNaN(n)?'-':n).join('-')+' '+ins;
 if(nums.some(isNaN)&&!ins){return}
 const okIns=INSCRIPTIONS.includes(ins);
 if(okIns&&eq(nums,OPEN)){show('open');log(inp,'seal-open')}
 else if(okIns&&eq(nums,SHUT)){show('shut');log(inp,'seal-shut')}
 else{log(inp,'egg');egg()}
};
(function(){
 const tr=$('trees'),h=$('hint');
 Object.keys(TREES).forEach(k=>{const T=TREES[k],b=document.createElement('button');b.innerHTML=T.icon+' '+T.name+'<small>'+T.en+'</small>';
  b.onclick=()=>{
   [...tr.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');h.style.display='block';h.innerHTML='';
   const m=document.createElement('p');m.className='m';m.textContent=T.name+'：'+T.m;
   const n=document.createElement('p');n.className='n';n.textContent=T.n?T.n.join(' ・ '):'■ ・ ■■■ ・ ■';
   const d=document.createElement('p');d.className='d';d.textContent=T.d;
   h.append(m,n,d);
   if(T.n){const f=document.createElement('button');f.textContent='填入轉輪';f.onclick=()=>{T.n.forEach((v,i)=>$('d'+(i+1)).value=v)};h.appendChild(f)}
   log(k,'tree-'+k);
  };tr.appendChild(b)});
})();
$('reset').onclick=()=>{['d1','d2','d3','ins'].forEach(i=>$(i).value='');$('out').innerHTML='';$('seal').className='seal'};
['d1','d2','d3'].forEach(i=>$(i).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'')}));
// ---- 紀錄 ----
const KEY='libra_log';
const getLog=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
function log(input,state){
 const e={week:WEEK,time:new Date().toISOString(),input,state};
 try{const a=getLog();a.push(e);localStorage.setItem(KEY,JSON.stringify(a))}catch(x){}
 if(ENDPOINT){try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(e)})}catch(x){}}
 drawLog();
}
const det=e=>e.input!==undefined?e.input:((e.left||[]).join('+')+' | '+(e.right||[]).join('+'));
function drawLog(){
 $('logtbl').innerHTML='<tr><th>時間</th><th>週</th><th>輸入</th><th>狀態</th></tr>'+getLog().slice().reverse().map(e=>'<tr><td>'+e.time.slice(5,16).replace('T',' ')+'</td><td>'+e.week+'</td><td>'+det(e)+'</td><td>'+e.state+'</td></tr>').join('');
}
$('exp').onclick=()=>{const csv='week,time,input,state\n'+getLog().map(e=>[e.week,e.time,'"'+det(e)+'"',e.state].join(',')).join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='libra_log.csv';l.click()};
$('clr').onclick=()=>{if(confirm('清空此瀏覽器的紀錄？')){localStorage.removeItem(KEY);drawLog()}};
if(location.hash==='#admin'){$('admin').style.display='block';drawLog()}
</script>
</body>
</html>
