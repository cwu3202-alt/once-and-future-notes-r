<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>被改寫的圓桌・第七週：梅林的兵推</title>
<style>
:root{--bg:#16181a;--slate:#24272a;--slate2:#2e3236;--bone:#ddd5c2;--dim:#8c8a80;--bronze:#b08a4a;--verd:#6aa396;--red:#b55a4a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.8}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
h1{font-size:1.2rem;font-weight:600;letter-spacing:.25em;text-align:center;margin:28px 0 2px}
.sub{text-align:center;color:var(--bronze);font-size:.9rem;letter-spacing:.3em;margin:0 0 8px}
.intro{border-left:2px solid var(--bronze);padding:2px 14px;margin:10px 0 14px;font-size:.92rem}.intro p{margin:.4em 0}
.hn{color:var(--dim);font-size:.82rem;margin:0 0 8px;padding-left:10px;border-left:2px solid #3a3f44}
.lbl{font-size:.8rem;color:var(--dim);margin:16px 0 6px}
.lbl b{color:var(--verd);font-weight:400;margin-left:8px}
button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--verd);outline-offset:2px}
.pawn{position:absolute;right:0;top:34px;background:none;border:0;font-size:1.3rem;opacity:.28;padding:6px 10px}
.lk{margin:12px 0;padding:12px;background:var(--slate);border:1px solid #3a3f44}.lk.ok{border-color:var(--verd)}.lk p{margin:0 0 8px;font-size:.92rem}.lk input{width:100%;padding:12px;text-align:center;font-size:1.2rem;letter-spacing:.25em;background:#1b1d1f;border:1px solid #555b61;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}.lk.ok input{color:var(--verd)}
.beam{height:6px;width:70%;margin:16px auto 10px;background:var(--bronze);border-radius:3px;transition:transform 1.2s cubic-bezier(.3,1.5,.5,1)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zone{background:var(--slate);border:1px solid #3a3f44;padding:8px;min-height:110px;font-size:.85rem;color:var(--dim)}
#zL{border-color:var(--verd)}#zR{border-color:var(--bronze)}
.zone .card{display:block;width:100%;margin:3px 0;padding:8px;background:var(--slate2);border:1px solid #4a4f55;color:var(--bone);min-height:40px}
.pool{margin:10px 0;padding:6px;border:1px dashed #3a3f44}
.prow{display:flex;align-items:center;gap:6px;margin:4px 0}.prow .nm{flex:1;text-align:center}
.go{min-width:60px;min-height:42px;background:var(--slate2);border:1px solid #4a4f55;font-size:.9rem}
.go.l{border-color:var(--verd);color:var(--verd)}.go.r{border-color:var(--bronze);color:var(--bronze)}.go:disabled{opacity:.25}
.rings{display:flex;gap:4px;justify-content:center;margin:10px 0}
.col{display:flex;flex-direction:column;gap:4px;width:48px}
.arr{height:36px;background:var(--slate2);border:1px solid #3f444a;color:var(--dim)}
.rg{height:80px;display:grid;place-items:center;background:linear-gradient(160deg,#3a3e42,#25282b);border:1px solid #555b61;border-radius:8px;box-shadow:inset 0 0 14px #000a}
.rg svg{width:56%;height:54px;fill:none;stroke:var(--bone);stroke-width:3.4;stroke-linecap:square;stroke-linejoin:miter;transition:stroke .6s}
.rings.ok svg{stroke:var(--verd)}
details{margin:6px 0 14px;border:1px solid #3a3f44;padding:6px 12px;font-size:.85rem;color:var(--dim)}summary{cursor:pointer;padding:6px 0}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.chart div{text-align:center;background:var(--slate);padding:4px 0}
.chart svg{width:18px;height:34px;fill:none;stroke:var(--bone);stroke-width:3;stroke-linecap:square;stroke-linejoin:miter;display:block;margin:0 auto}
.chart span{font-size:.75rem;color:var(--bronze)}
.row{display:flex;gap:10px;margin:14px 0}
.act{flex:1;padding:12px;background:transparent;border:1px solid var(--bronze);letter-spacing:.2em}
.act.main{background:var(--bronze);color:#16181a}
#choice,#s2{margin:18px 0;padding:16px;border:1px solid var(--verd);text-align:center}
.tok{display:flex;gap:8px;margin:10px 0}.tok button{flex:1;padding:12px 4px;background:var(--slate);border:1px solid #3a3f44;font-size:.88rem}.tok button:disabled{opacity:.3}
.seq{min-height:1.8em;color:var(--bronze);font-size:.9rem}
.dials{display:flex;gap:8px;justify-content:center;margin:8px 0}
.dials input{width:30%;min-width:0;text-align:center;padding:12px 4px;font-size:1.4rem;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--bronze);background:var(--slate);border:1px solid #555b61}
.hint{color:var(--dim);font-size:.82rem;margin:2px 0 8px}
.pl{width:100%;padding:12px;text-align:center;font-size:1.2rem;letter-spacing:.3em;background:var(--slate);border:1px solid #555b61;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.res{margin:18px 0 40px;padding:24px 20px;background:linear-gradient(160deg,#2c2f32,#202326);border:1px solid #444a50;box-shadow:inset 0 0 40px #0008}
.res p{margin:0 0 1em;white-space:pre-line;opacity:0;animation:rise .9s forwards}
.res .t{font-size:.8rem;letter-spacing:.2em;opacity:1;animation:none;color:var(--verd)}
.res .q{border-left:2px solid var(--dim);padding-left:12px;color:#e9e1cc}
.res .note{color:var(--bronze);border-top:1px solid #444a50;padding-top:14px}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.code{margin-top:18px;text-align:center;opacity:0;animation:rise 1.2s forwards}.code small{display:block;color:var(--dim);font-size:.78rem;letter-spacing:.2em}.code b{display:block;color:var(--bronze);font-size:1.8rem;letter-spacing:.35em;user-select:all;-webkit-user-select:all}
#pop{position:fixed;inset:0;z-index:99;background:#000c;display:flex;align-items:center;justify-content:center;padding:24px;animation:rise .6s both}
#pop .card{max-width:440px;width:100%;padding:26px 22px;background:linear-gradient(160deg,#2c2f32,#202326);border:1px solid var(--bronze)}
#pop .m{white-space:pre-line;line-height:2}#pop .f{color:var(--dim);font-size:.85rem;margin-top:12px;white-space:pre-line}
#pop button{display:block;margin:20px auto 0;padding:10px 28px;background:transparent;border:1px solid var(--bronze);letter-spacing:.3em}
#admin{display:none;font-size:.78rem;color:var(--dim);margin-bottom:40px}
#admin table{width:100%;border-collapse:collapse}#admin td,#admin th{border-bottom:1px solid #333;padding:3px 4px;text-align:left;vertical-align:top}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div style="position:relative">
<h1>被改寫的圓桌</h1>
<p class="sub">第七週・梅林的兵推</p>
<button class="pawn" id="pawn" aria-label="一枚落單的棋子" style="display:none">♟</button>
</div>
<div class="intro"><p>沙盤上擺著你走過的一切。<br>上面是天平，下面是環輪。兩樣都穩住，梅林才會開口。</p><p>沙盤邊壓著梅林的紙條，每一關都有一句。</p></div>

<div id="s1">
 <div class="lbl">天平<b id="c1"></b></div>
 <p class="hn">「天平要平。更深的魔法只認王的裁決，所以王必須在場。每一邊，最多三樣。」</p>
 <div class="beam" id="beam"></div>
 <div class="zones"><div class="zone" id="zL"></div><div class="zone" id="zR"></div></div>
 <div class="pool" id="pool"></div>
 <div class="lbl">環輪<b id="c2"></b></div>
 <p class="hn">「這個故事裡，有兩個名字被反覆寫了又寫。挑一個，用最古老的文字刻上去。四個環，四個記號，一個不能少。」</p>
 <div class="rings" id="rings"></div>
 <details><summary>梅林的符文對照表</summary><div class="chart" id="chart"></div></details>
</div>

<div id="choice" style="display:none"><div>梅林在等你。</div><p class="hn" style="text-align:left">「石桌之前，人只能站一邊。」</p><div class="row"><button class="act" data-c="arthur">亞瑟王</button><button class="act" data-c="anna">Anna</button></div></div>

<div id="s2" style="display:none">
 <div class="lbl">復盤：照發生的先後，點三個事件</div>
 <p class="hn" style="text-align:left">「日子不會說謊。回頭翻日曆，先發生的先點。」</p>
 <div class="tok" id="tok"></div><div class="seq" id="seq"></div>
 <div class="lbl">封印的三個轉輪</div>
 <p class="hn" style="text-align:left">「封印鎖上的時候，數字是倒著數的。」</p>
 <div class="dials"><input id="d1" inputmode="numeric" maxlength="4" aria-label="第一個轉輪"><input id="d2" inputmode="numeric" maxlength="4" aria-label="第二個轉輪"><input id="d3" inputmode="numeric" maxlength="4" aria-label="第三個轉輪"></div>
 <div id="plw" style="display:none"><div class="lbl">車牌</div><input id="pl" class="pl" maxlength="10" autocomplete="off" autocapitalize="characters" aria-label="車牌"></div>
 <div class="row"><button class="act main" id="go2">復盤</button></div>
</div>

<div class="row"><button class="act" id="reset">重置</button></div>
<div id="out"></div>

<div id="admin"><p>後台紀錄（僅此瀏覽器）</p><div class="row"><button class="act" id="exp">匯出 CSV</button><button class="act" id="clr">清空</button></div><table id="logtbl"></table></div>

<script>
// ===== 每週只需改這一區 =====
const WEEK = 7;
const ENDPOINT = ""; // 選填：Google Apps Script / Formspree 網址
const CODES = {s1:'', s2:''}; // 選填：解完後要貼到群組的數字（留空就不顯示）
// 彩蛋：沙盤右上角一枚落單的棋子，點下去會跳出這段話。留空 ('') 則棋子不會出現。
const MSG = '這一步會不會選錯？還是說我真的該和螢幕面前的你說出這一段話呢？';
const MSG_FOOT = '';
const CARDS=[['w6','權杖6',6],['s10','寶劍10',10],['sk','寶劍國王',14],['s5','寶劍5',5],['sn','寶劍騎士',12],['w2','權杖2',2],['p10','金幣10',10]];
const MAXSIDE=3, KING='sk';          // 兩邊總和相等、國王在場
const KEYS=['JOHN','ANNA'];          // 環輪要拼出的名字（任一個都可以）
const KEYN=4;                        // 環輪數量
const EVENTS={john:'John 逃亡日',anna:'Anna 行動日',knight:'騎士遭暗殺日'};
const ORDER=['john','anna','knight']; // 依第三週日期 0220 → 0305 → 0312
const WHEEL=[2,257,8];               // 第四週封印「鎖上」的方向
const PLATE='';                     // 車牌答案（復盤時多一格要填）。留空 '' 就不會出現這一格。大小寫與橫線不影響
const STORY={
 s1:{t:'沙盤・沉默的梅林',p:[
  ['天平穩住了，環輪停在了正確的位置。\n沙盤上所有的小旗同時轉向了你。'],
  ['梅林什麼也沒有說。\n只有一個聲音，不經過耳朵，直接在你心裡響起。這是心靈通話。'],
  ['「想要知道答案，你必須先做出抉擇。」','q']]},
 arthur:{t:'沙盤・重來',p:[
  ['梅林滿意地收起了那面小旗。\n「果然，是這個結果。」'],
  ['沙盤上的棋子一枚一枚歸位，局勢被重新擺了一遍。','note']]},
 anna:{t:'沙盤・另一個方向',p:[
  ['沙盤上，John 的棋子慢慢轉過身，走向了另一邊。'],
  ['心裡的聲音第一次出現了猶豫：\n「……原來如此。」','q']]},
 s2:{t:'復盤・梅林的兵推',p:[
  ['你按下最後一枚棋子，整張沙盤亮了起來。\n你這才發現，這條線從頭到尾，都是梅林的兵推。'],
  ['每一道封印、每一次追殺、每一個抉擇，全是他在這張桌子上推演出來的局。'],
  ['可惜，結果跟梅林想的不一樣。\nJohn 選擇了 Anna。','q'],
  ['然而殺人這件事，已經是事實。\n遠方傳來號角聲。那是前所未有的恐懼：憤怒的亞瑟王，帶著他的大軍。'],
  ['沙盤的另一端，梅林靜靜看著，似乎還有別的盤算。','note']]}
};
const R=[['F','M8 4V36M8 14L18 6M8 24L18 16'],['U','M6 4V36M6 4L16 14V36'],['TH','M8 4V36M8 12L18 20L8 28'],['A','M8 4V36M8 6L18 14M8 16L18 24'],['R','M8 4V36M8 4L18 12L8 20L18 36'],['C','M16 10L6 20L16 30'],['G','M4 8L16 32M16 8L4 32'],['W','M8 4V36M8 4L18 12L8 20'],['H','M5 4V36M15 4V36M5 14L15 26'],['N','M10 4V36M4 14L16 24'],['I','M10 4V36'],['J','M13 6L6 13L13 20M7 22L14 29L7 36'],['EI','M10 4V36M10 4L4 12M10 36L16 28'],['P','M6 36V4H16V18H6'],['Z','M10 36V4M10 20L3 10M10 20L17 10'],['S','M14 4L6 16L14 22L6 34'],['T','M10 36V4M10 4L3 14M10 4L17 14'],['B','M6 4V36M6 4L15 12L6 20L15 28L6 36'],['E','M5 4V36M15 4V36M5 4L10 14L15 4'],['M','M5 4V36M15 4V36M5 4L15 20M15 4L5 20'],['L','M6 36V4M6 4L16 14'],['NG','M10 6L16 20L10 34L4 20Z'],['D','M5 4V36M15 4V36M5 4L15 36M15 4L5 36'],['O','M10 4L16 12L10 20L4 12ZM10 20L5 36M10 20L15 36']];
// ===== 以下為程式 =====
const $=id=>document.getElementById(id);
const svg=d=>'<svg viewBox="0 0 20 40" aria-hidden="true"><path d="'+d+'"/></svg>';
const pos={},ridx=Array(KEYN).fill(0);
let s1done=false,s2done=false,seq=[];
CARDS.forEach(c=>pos[c[0]]=0);
const side=k=>CARDS.filter(c=>pos[c[0]]===k);
const sum=a=>a.reduce((x,c)=>x+c[2],0);
const balOK=()=>{const L=side(1),R2=side(2);return L.length&&R2.length&&sum(L)===sum(R2)&&[...L,...R2].some(c=>c[0]===KING)};
const runeOK=()=>KEYS.includes(ridx.map(i=>R[i][0]).join(''));
function put(id,k){if(k&&side(k).length>=MAXSIDE)return;pos[id]=k;render();check()}
function render(){
 const pl=$('pool');pl.innerHTML='';
 side(0).forEach(c=>{const d=document.createElement('div');d.className='prow';
  const l=document.createElement('button');l.className='go l';l.textContent='◀ 左';l.disabled=side(1).length>=MAXSIDE;l.onclick=()=>put(c[0],1);
  const r=document.createElement('button');r.className='go r';r.textContent='右 ▶';r.disabled=side(2).length>=MAXSIDE;r.onclick=()=>put(c[0],2);
  const n=document.createElement('span');n.className='nm';n.textContent=c[1];d.append(l,n,r);pl.appendChild(d)});
 [['zL',1],['zR',2]].forEach(([e,k])=>{const z=$(e);z.innerHTML=side(k).length?'':(k===1?'左盤':'右盤');side(k).forEach(c=>{const b=document.createElement('button');b.className='card';b.textContent=c[1]+'　✕';b.onclick=()=>put(c[0],0);z.appendChild(b)})});
 const L=side(1),Rr=side(2),a=(L.length+Rr.length)?Math.max(-14,Math.min(14,(sum(Rr)-sum(L))*2)):0;
 $('beam').style.transform='rotate('+a+'deg)';
 $('c1').textContent=balOK()?'✓':'';$('c2').textContent=runeOK()?'✓':'';
 for(let i=0;i<KEYN;i++)$('r'+i).innerHTML=svg(R[ridx[i]][1]);
 $('rings').classList.toggle('ok',runeOK());
}
function buildRings(){
 const w=$('rings');
 for(let i=0;i<KEYN;i++){const c=document.createElement('div');c.className='col';
  const u=document.createElement('button');u.className='arr';u.textContent='▲';u.setAttribute('aria-label','上一個符文');u.onclick=()=>{ridx[i]=(ridx[i]+R.length-1)%R.length;render();check()};
  const g=document.createElement('div');g.className='rg';g.id='r'+i;
  const d=document.createElement('button');d.className='arr';d.textContent='▼';d.setAttribute('aria-label','下一個符文');d.onclick=()=>{ridx[i]=(ridx[i]+1)%R.length;render();check()};
  c.append(u,g,d);w.appendChild(c)}
 $('chart').innerHTML=R.map(r=>'<div>'+svg(r[1])+'<span>'+r[0]+'</span></div>').join('');
}
function show(k){
 const S=STORY[k],o=$('out');o.innerHTML='';
 const d=document.createElement('div');d.className='res';d.innerHTML='<p class="t">'+S.t+'</p>';
 S.p.forEach((x,i)=>{const p=document.createElement('p');p.textContent=x[0];if(x[1])p.className=x[1];p.style.animationDelay=(i*1.3+.4)+'s';d.appendChild(p)});
 const cd=CODES[k];if(cd){const c=document.createElement('div');c.className='code';c.style.animationDelay=(S.p.length*1.3+.8)+'s';c.innerHTML='<small>把這組數字傳到群組</small><b>'+cd+'</b>';d.appendChild(c)}
 o.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'start'});
}
function check(){
 if(s1done||!balOK()||!runeOK())return;
 s1done=true;show('s1');log(side(1).map(c=>c[1]).join('+')+'|'+side(2).map(c=>c[1]).join('+')+'|'+ridx.map(i=>R[i][0]).join(''),'s1-done');
 setTimeout(()=>{$('choice').style.display='block'},3200);
}
document.querySelectorAll('#choice button').forEach(b=>b.onclick=()=>{
 const c=b.dataset.c;log(c,'choice-'+c);
 if(c==='arthur'){CARDS.forEach(x=>pos[x[0]]=0);ridx.fill(0);s1done=false;$('choice').style.display='none';render();show('arthur')}
 else{$('choice').style.display='none';$('s2').style.display='block';show('anna')}
});
function drawTok(){
 const t=$('tok');t.innerHTML='';
 [...ORDER].sort((a,b)=>(a<b?1:-1)).forEach(k=>{const b=document.createElement('button');b.textContent=EVENTS[k];b.disabled=seq.includes(k);
  b.onclick=()=>{seq.push(k);if(seq.length===ORDER.length&&!seq.every((x,i)=>x===ORDER[i])){$('seq').textContent='順序不對，棋子退回。';seq=[]}else $('seq').textContent=seq.map(x=>EVENTS[x]).join(' → ');drawTok()};t.appendChild(b)});
}
$('go2').onclick=()=>{
 const nz=x=>(x||'').toUpperCase().replace(/[\s\-_]/g,''),okP=!PLATE||nz($('pl').value)===nz(PLATE),n=['d1','d2','d3'].map(i=>parseInt($(i).value,10)),okS=seq.length===ORDER.length&&seq.every((x,i)=>x===ORDER[i]),okW=n.every((v,i)=>v===WHEEL[i])&&okP;
 log(seq.join('>')+' '+n.join('-'),okS&&okW?'s2-done':'s2-wrong');
 if(okS&&okW&&!s2done){s2done=true;show('s2')}else if(!(okS&&okW)){$('seq').textContent='沙盤沒有反應。'}
};
['d1','d2','d3'].forEach(i=>$(i).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'')}));
$('pawn').onclick=()=>{
 if(!MSG||$('pop'))return;
 const L=document.createElement('div');L.id='pop';L.setAttribute('role','dialog');L.setAttribute('aria-modal','true');
 const c=document.createElement('div');c.className='card';const m=document.createElement('div');m.className='m';m.textContent=MSG;c.appendChild(m);
 if(MSG_FOOT){const f=document.createElement('div');f.className='f';f.textContent=MSG_FOOT;c.appendChild(f)}
 const b=document.createElement('button');b.textContent='關上';b.onclick=()=>L.remove();c.appendChild(b);L.appendChild(c);document.body.appendChild(L);b.focus();
};
$('reset').onclick=()=>{CARDS.forEach(x=>pos[x[0]]=0);ridx.fill(0);s1done=false;s2done=false;seq=[];$('choice').style.display='none';$('s2').style.display='none';$('out').innerHTML='';$('seq').textContent='';['d1','d2','d3'].forEach(i=>$(i).value='');render();drawTok()};
// ---- 紀錄（不記錄彩蛋）----
const LK='libra_log';
const getLog=()=>{try{return JSON.parse(localStorage.getItem(LK)||'[]')}catch(e){return[]}};
function log(input,state){
 const e={week:WEEK,time:new Date().toISOString(),input,state};
 try{const a=getLog();a.push(e);localStorage.setItem(LK,JSON.stringify(a))}catch(x){}
 if(ENDPOINT){try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(e)})}catch(x){}}
 drawLog();
}
const det=e=>e.input!==undefined?e.input:((e.left||[]).join('+')+' | '+(e.right||[]).join('+'));
function drawLog(){
 $('logtbl').innerHTML='<tr><th>時間</th><th>週</th><th>輸入</th><th>狀態</th></tr>'+getLog().slice().reverse().map(e=>'<tr><td>'+e.time.slice(5,16).replace('T',' ')+'</td><td>'+e.week+'</td><td>'+det(e)+'</td><td>'+e.state+'</td></tr>').join('');
}
$('exp').onclick=()=>{const csv='week,time,input,state\n'+getLog().map(e=>[e.week,e.time,'"'+det(e)+'"',e.state].join(',')).join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='libra_log.csv';l.click()};
$('clr').onclick=()=>{if(confirm('清空此瀏覽器的紀錄？')){localStorage.removeItem(LK);drawLog()}};
if(location.hash==='#admin'){$('admin').style.display='block';drawLog()}
if(MSG)$('pawn').style.display='block';
if(PLATE)$('plw').style.display='block';
buildRings();render();drawTok();
</script>
</body>
</html>
