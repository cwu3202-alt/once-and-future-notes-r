<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>被改寫的圓桌・第五週：第二封印</title>
<style>
:root{--bg:#16181a;--slate:#24272a;--slate2:#2e3236;--bone:#ddd5c2;--dim:#8c8a80;--bronze:#b08a4a;--verd:#6aa396;--red:#b55a4a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.8}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
h1{font-size:1.2rem;font-weight:600;letter-spacing:.25em;text-align:center;margin:28px 0 2px}
.sub{text-align:center;color:var(--bronze);font-size:.9rem;letter-spacing:.3em;margin:0 0 8px}
.intro{border-left:2px solid var(--bronze);padding:2px 14px;margin:10px 0 14px;font-size:.92rem}.intro p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--verd);outline-offset:2px}
.modes{display:flex;gap:8px;margin:12px 0 6px}
.modes button{flex:1;padding:12px;background:var(--slate);border:1px solid #3a3f44;letter-spacing:.3em;font-size:1.05rem}
.modes button.on{border-color:var(--bronze);color:var(--bronze);background:#2b2e31}
.tip{text-align:center;color:var(--dim);font-size:.82rem;margin:4px 0 12px;min-height:1.6em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(86vw,360px);aspect-ratio:1;margin:0 auto;transition:gap 1s,box-shadow 1s}
.grid button{padding:0;border:2px solid #3a3f44;background:#000;display:block;overflow:hidden}
.grid button.sel{border-color:var(--bronze);box-shadow:0 0 10px #b08a4a99}
.grid button svg{width:100%;height:100%;display:block}
.grid.done{gap:0;box-shadow:0 0 30px #6aa39666}.grid.done button{border-color:transparent}
.sm{display:block;width:min(86vw,360px);aspect-ratio:1;margin:0 auto;padding:0;background:none;border:0}
.sm svg{width:100%;height:100%;display:block;border:1px solid #3a3f44}
.sm.hit svg{animation:hit .18s}
@keyframes hit{25%{transform:translate(4px,-2px) rotate(.6deg)}75%{transform:translate(-4px,2px) rotate(-.6deg)}}
#stoneG{transition:opacity 1.4s,transform 1.4s;transform-origin:150px 200px}
.broken #stoneG{opacity:0;transform:translateY(40px) scale(1.15)}
#vial{opacity:0;transition:opacity 1.6s 1s;filter:drop-shadow(0 0 12px #6aa396)}
.broken #vial{opacity:1}
.ck{fill:none;stroke:#0b0c0d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .25s}
.cnt{text-align:center;color:var(--dim);font-size:.8rem;margin:8px 0}
.row{display:flex;gap:10px;margin:14px 0}
.act{flex:1;padding:12px;background:transparent;border:1px solid var(--bronze);letter-spacing:.2em}
.salute{display:block;width:100%;padding:14px;background:#2a1b19;border:1px solid #6b3a32;color:#e0a99f;letter-spacing:.8em;font-size:1.1rem;margin:6px 0}
.res{margin:18px 0 40px;padding:24px 20px;background:linear-gradient(160deg,#2c2f32,#202326);border:1px solid #444a50;box-shadow:inset 0 0 40px #0008}
.res p{margin:0 0 1em;white-space:pre-line;opacity:0;animation:rise .9s forwards}
.res .t{font-size:.8rem;letter-spacing:.2em;opacity:1;animation:none;color:var(--verd)}
.res .q{border-left:2px solid var(--dim);padding-left:12px;color:#e9e1cc}
.res .note{color:var(--bronze);border-top:1px solid #444a50;padding-top:14px}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.code{margin-top:18px;text-align:center;opacity:0;animation:rise 1.2s forwards}.code small{display:block;color:var(--dim);font-size:.78rem;letter-spacing:.2em}.code b{display:block;color:var(--bronze);font-size:1.8rem;letter-spacing:.35em;user-select:all;-webkit-user-select:all}
#egg{position:fixed;inset:0;z-index:99;background:#0b0c0d;color:#e0a99f;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;animation:rise .4s both}
#egg .e1{font-size:1.35rem;font-weight:700;line-height:1.9;max-width:460px}
#admin{display:none;font-size:.78rem;color:var(--dim);margin-bottom:40px}
#admin table{width:100%;border-collapse:collapse}#admin td,#admin th{border-bottom:1px solid #333;padding:3px 4px;text-align:left;vertical-align:top}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <linearGradient id="gbg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="300"><stop offset="0" stop-color="#0d1214"/><stop offset=".5" stop-color="#1b2326"/><stop offset="1" stop-color="#2d3a38"/></linearGradient>
  <g id="bg">
   <rect width="300" height="300" fill="url(#gbg)"/>
   <circle cx="248" cy="46" r="20" fill="#e6e1c9" opacity=".85"/>
   <g fill="#e6e1c9"><circle cx="30" cy="28" r="1.8"/><circle cx="84" cy="60" r="1.2"/><circle cx="204" cy="24" r="1.6"/><circle cx="20" cy="150" r="1.4"/><circle cx="280" cy="140" r="1.6"/><circle cx="60" cy="236" r="1.2"/><circle cx="250" cy="270" r="1.8"/><circle cx="170" cy="284" r="1.2"/></g>
   <path d="M0 262 Q60 246 120 262 T240 262 T300 258 V300 H0Z" fill="#0f1a16"/>
  </g>
  <g id="fg">
   <circle cx="150" cy="16" r="7" fill="#b08a4a"/>
   <rect x="146" y="22" width="8" height="22" fill="#6b4a2a"/>
   <rect x="118" y="44" width="64" height="9" rx="2" fill="#b08a4a"/>
   <rect x="144" y="53" width="12" height="70" fill="#d0d4d8"/>
   <path d="M40 262 L52 160 L88 114 L150 98 L214 112 L252 164 L264 262Z" fill="#555b60" stroke="#2b2f33" stroke-width="3"/>
   <path d="M88 114 L104 170 L84 220 M214 112 L196 176 L222 230" fill="none" stroke="#3b4146" stroke-width="2"/>
   <g fill="none" stroke="#8c9399" stroke-width="2" stroke-linecap="square"><path d="M120 200V224M120 206L130 212"/><path d="M168 196V226M168 196L180 204"/></g>
  </g>
 </defs>
</svg>

<h1>被改寫的圓桌</h1>
<p class="sub">第五週・第二封印</p>
<div class="intro"><p>John 破解了第一封印。<br>碎光落盡，他來到一顆石頭面前——亞瑟王當年拔出聖劍的那一顆。</p><p>石頭只給了兩種辦法：拼起來，或打碎。</p></div>

<div class="modes"><button id="mA" class="on">拼起來</button><button id="mB">打碎</button></div>
<div class="tip" id="tip"></div>

<div id="pA"><div class="grid" id="grid"></div></div>
<div id="pB" style="display:none">
 <button class="sm" id="sm" aria-label="敲擊石頭">
  <svg viewBox="0 0 300 300" id="ssv">
   <use href="#bg"/>
   <g id="stoneG"><use href="#fg"/>
    <g id="cracks"><path class="ck" d="M150 98L146 126L160 150"/><path class="ck" d="M146 126L120 150L124 180"/><path class="ck" d="M160 150L186 168L182 204"/><path class="ck" d="M124 180L100 206L108 250"/><path class="ck" d="M182 204L204 226L196 258"/><path class="ck" d="M142 196L150 230L140 262"/></g>
   </g>
   <g id="vial"><circle cx="150" cy="188" r="44" fill="#6aa396" opacity=".18"/><rect x="141" y="140" width="18" height="30" rx="3" fill="#c9d6d2"/><rect x="138" y="132" width="24" height="10" rx="3" fill="#7a5a34"/><path d="M141 170 Q116 178 118 204 Q120 232 150 232 Q180 232 182 204 Q184 178 159 170Z" fill="#6aa396" stroke="#c9d6d2" stroke-width="3"/><path d="M130 200 Q134 190 140 188" fill="none" stroke="#e9ffe0" stroke-width="3" stroke-linecap="round" opacity=".8"/></g>
  </svg>
 </button>
 <div class="cnt" id="cnt"></div>
</div>

<div class="row"><button class="act" id="reset">重置</button></div>
<button class="salute" id="salute">立　正</button>
<div id="out"></div>

<div id="admin"><p>後台紀錄（僅此瀏覽器）</p><div class="row"><button class="act" id="exp">匯出 CSV</button><button class="act" id="clr">清空</button></div><table id="logtbl"></table></div>

<script>
// ===== 每週只需改這一區 =====
const WEEK = 5;
const ENDPOINT = ""; // 選填：Google Apps Script / Formspree 網址
const CODES = {assemble:'', smash:'', salute:''}; // 選填：解完後要貼到群組的數字（留空就不顯示）
const HITS = 12; // 打碎模式需要敲幾下
const SALUTE = '報告班長新兵吳傳典請示，什麼時候可以驗退離開這個狗幹爛的地方。';
const STORY = {
 assemble:{t:'拼起來・石中之劍',p:[
  ['碎光落盡。John 把散落的石塊一片一片拼回原位。\n石面上浮現一圈細小的符文——這就是亞瑟王當年拔出聖劍的那顆石頭。'],
  ['John 渾身發冷，他終於明白：這顆石頭從來不是天命的試煉。\n當年的女妖故意讓亞瑟王拔出了劍。用這個「天選之人」的謊言，從那一刻起，她便一直控制著他。','q'],
  ['而這顆石頭的裡面……']]},
 smash:{t:'打碎・石中之物',p:[
  ['John 在最後一刻發了瘋似的，想要把石頭徹底毀掉。\n拳頭、劍柄、斷裂的劍刃，什麼都用上了。'],
  ['石面一寸一寸裂開。裂縫深處沒有咒印，沒有怪物，只有一只微微發光的小瓶。\n瓶身刻著兩個字：Anna。','q'],
  ['石頭裡居然暗藏了 Anna 的解藥。'],
  ['梅林筆記：\n「有人把解藥藏在詛咒最深的地方，因為她知道，只有真心想毀掉它的人才找得到。」','note']]}
};
// ===== 以下為程式 =====
const $=id=>document.getElementById(id);
let mode='A',perm=[],sel=null,hits=0,doneA=false,doneB=false;
const TIPS={A:'點兩塊碎片，讓它們對調位置，拼回完整的石頭。',B:'用力敲石頭。'};
function shuffle(){do{perm=[0,1,2,3,4,5,6,7,8];for(let i=8;i>0;i--){const j=Math.floor(Math.random()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}}while(perm.every((v,i)=>v===i))}
function drawGrid(){
 const g=$('grid');g.innerHTML='';g.classList.toggle('done',doneA);
 perm.forEach((k,i)=>{const b=document.createElement('button');b.className=sel===i?'sel':'';b.disabled=doneA;b.setAttribute('aria-label','碎片 '+(i+1));
  b.innerHTML='<svg viewBox="'+(k%3)*100+' '+Math.floor(k/3)*100+' 100 100"><use href="#bg"/><use href="#fg"/></svg>';
  b.onclick=()=>{
   if(sel===null){sel=i}else{if(sel!==i){[perm[sel],perm[i]]=[perm[i],perm[sel]]}sel=null}
   drawGrid();
   if(perm.every((v,x)=>v===x)){doneA=true;drawGrid();show('assemble');log(perm.join(''),'assemble-done')}
  };g.appendChild(b)});
}
function drawSmash(){
 [...document.querySelectorAll('.ck')].forEach((c,i)=>c.style.opacity=hits>(i+1)*2-2?1:0);
 $('cnt').textContent=doneB?'':(hits?'已敲 '+hits+' 下':'');
 $('pB').classList.toggle('broken',doneB);
}
$('sm').onclick=()=>{
 if(doneB)return;hits++;const s=$('sm');s.classList.remove('hit');void s.offsetWidth;s.classList.add('hit');
 if(hits>=HITS){doneB=true;drawSmash();setTimeout(()=>{show('smash');log('hits='+hits,'smash-done')},1800)}else drawSmash();
};
function setMode(m){
 mode=m;$('mA').classList.toggle('on',m==='A');$('mB').classList.toggle('on',m==='B');
 $('pA').style.display=m==='A'?'block':'none';$('pB').style.display=m==='B'?'block':'none';
 $('tip').textContent=TIPS[m];$('out').innerHTML='';
 if(m==='A'&&doneA)show('assemble');if(m==='B'&&doneB)show('smash');
}
$('mA').onclick=()=>setMode('A');$('mB').onclick=()=>setMode('B');
function show(k){
 const S=STORY[k],o=$('out');o.innerHTML='';
 const d=document.createElement('div');d.className='res';d.innerHTML='<p class="t">'+S.t+'</p>';
 S.p.forEach((x,i)=>{const p=document.createElement('p');p.textContent=x[0];if(x[1])p.className=x[1];p.style.animationDelay=(i*1.3+.4)+'s';d.appendChild(p)});
 if(CODES[k]){const c=document.createElement('div');c.className='code';c.style.animationDelay=(S.p.length*1.3+.8)+'s';c.innerHTML='<small>把這組數字傳到群組</small><b>'+CODES[k]+'</b>';d.appendChild(c)}
 o.appendChild(d);
}
$('salute').onclick=()=>{
 if($('egg'))return;log('立正','salute');
 const L=document.createElement('div');L.id='egg';L.setAttribute('role','alert');
 L.innerHTML='<div class="e1"></div>'+(CODES.salute?'<div class="code" style="animation-delay:2s"><small>把這組數字傳到群組</small><b>'+CODES.salute+'</b></div>':'');
 L.firstChild.textContent=SALUTE;document.body.appendChild(L);
 [...document.body.children].forEach(c=>{if(c!==L&&c.tagName!=='SCRIPT')c.inert=true});
};
$('reset').onclick=()=>{shuffle();sel=null;hits=0;doneA=false;doneB=false;$('out').innerHTML='';drawGrid();drawSmash()};
// ---- 紀錄 ----
const KEY='libra_log';
const getLog=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
function log(input,state){
 const e={week:WEEK,time:new Date().toISOString(),input,state};
 try{const a=getLog();a.push(e);localStorage.setItem(KEY,JSON.stringify(a))}catch(x){}
 if(ENDPOINT){try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(e)})}catch(x){}}
 drawLog();
}
const det=e=>e.input!==undefined?e.input:((e.left||[]).join('+')+' | '+(e.right||[]).join('+'));
function drawLog(){
 $('logtbl').innerHTML='<tr><th>時間</th><th>週</th><th>輸入</th><th>狀態</th></tr>'+getLog().slice().reverse().map(e=>'<tr><td>'+e.time.slice(5,16).replace('T',' ')+'</td><td>'+e.week+'</td><td>'+det(e)+'</td><td>'+e.state+'</td></tr>').join('');
}
$('exp').onclick=()=>{const csv='week,time,input,state\n'+getLog().map(e=>[e.week,e.time,'"'+det(e)+'"',e.state].join(',')).join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='libra_log.csv';l.click()};
$('clr').onclick=()=>{if(confirm('清空此瀏覽器的紀錄？')){localStorage.removeItem(KEY);drawLog()}};
if(location.hash==='#admin'){$('admin').style.display='block';drawLog()}
shuffle();drawGrid();drawSmash();$('tip').textContent=TIPS.A;
</script>
</body>
</html>
