<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>被改寫的圓桌・第一週</title>
<style>
:root{--bg:#16181a;--slate:#24272a;--slate2:#2e3236;--bone:#ddd5c2;--dim:#8c8a80;--bronze:#b08a4a;--verd:#6aa396;--red:#b55a4a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.8}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
h1{font-size:1.25rem;font-weight:600;letter-spacing:.3em;text-align:center;margin:28px 0 2px}
.sub{text-align:center;color:var(--dim);font-size:.85rem;margin:0 0 8px}
svg{width:100%;height:auto;display:block}
.beam,.pan{transition:transform 1.4s cubic-bezier(.3,1.5,.5,1)}
.beam{transform-origin:180px 40px}
.pan.l{transform-origin:60px 40px}.pan.r{transform-origin:300px 40px}
.sway .beam{animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.2deg)}}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zone{background:var(--slate);border:1px solid #3a3f44;padding:8px;min-height:150px}
.zone h2,.poolhead{font-size:.8rem;font-weight:400;color:var(--dim);margin:0 0 6px}
.sum{display:none} /* 若要顯示左右總和，刪掉這行 display:none */
.pool{margin:12px 0;padding:8px;border:1px dashed #3a3f44;min-height:60px}
.card{display:inline-flex;align-items:baseline;gap:6px;margin:3px;padding:6px 10px;background:var(--slate2);color:var(--bone);border:1px solid #4a4f55;font:inherit;font-size:.9rem;cursor:pointer;touch-action:manipulation}
.card b{color:var(--bronze);font-weight:600}
.card:focus-visible,button:focus-visible{outline:2px solid var(--verd);outline-offset:2px}
.zone .card{display:flex;width:100%;justify-content:space-between;margin:3px 0}
.intro{border-left:2px solid var(--bronze);padding:2px 14px;margin:10px 0 18px;font-size:.92rem}.intro p{margin:.4em 0}.intro .rule{color:var(--dim);font-size:.8rem}
.ds{display:block;font-size:.72rem;color:var(--dim);line-height:1.4;font-weight:400}
.tablet.fake .t{color:var(--bronze)}
.res{margin-top:20px;opacity:0;animation:rise 1.2s forwards}.res img{width:100%;height:auto;display:block;border:1px solid #444a50}
.tablet .res p{opacity:1;animation:none;text-align:center;margin:14px 0 0;color:var(--bronze);letter-spacing:.25em}.res .hint b{font-size:1.4rem;letter-spacing:.35em;margin-left:.5em}
.prow{display:flex;align-items:center;gap:6px;margin:4px 0}
.prow .nm{flex:1;text-align:center;font-size:.95rem}.prow .nm b{color:var(--bronze);margin-left:6px}
.go{min-width:64px;min-height:44px;background:var(--slate2);color:var(--bone);border:1px solid #4a4f55;font:inherit;font-size:.9rem;cursor:pointer;touch-action:manipulation}
.go.l{border-color:var(--verd);color:var(--verd)}.go.r{border-color:var(--bronze);color:var(--bronze)}
.go:disabled{opacity:.25;cursor:default}
#zoneL{border-color:var(--verd)}#zoneR{border-color:var(--bronze)}
.zone .card{min-height:44px}
.row{display:flex;gap:10px;margin:14px 0}
.act{flex:1;padding:12px;background:transparent;color:var(--bone);border:1px solid var(--bronze);font:inherit;letter-spacing:.2em;cursor:pointer}
.act.main{background:var(--bronze);color:#16181a}
.tablet{margin:18px 0 40px;padding:26px 22px;min-height:220px;background:linear-gradient(160deg,#2c2f32,#202326);border:1px solid #444a50;box-shadow:inset 0 0 40px #0008;font-size:1rem}
.tablet p{margin:0 0 .9em;opacity:0;animation:rise .9s forwards}
.tablet .t{font-size:.8rem;color:var(--dim);letter-spacing:.2em;opacity:1;animation:none}
.tablet.true .t{color:var(--verd)}.tablet.ten .t,.tablet.twelve .t{color:var(--bronze)}.tablet.chaos .t{color:var(--red)}
.tablet.silent{color:var(--dim);text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.tablet.chaos.shake{animation:shake .25s infinite}
@keyframes shake{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.tablet.chaos .frag{opacity:.7;margin:0 0 .3em;animation:none}
#admin{display:none;font-size:.78rem;color:var(--dim);margin-bottom:40px}
#admin table{width:100%;border-collapse:collapse}
#admin td,#admin th{border-bottom:1px solid #333;padding:3px 4px;text-align:left;vertical-align:top}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>被改寫的圓桌</h1>
<p class="sub">第一週</p>
<div class="intro">
<p>你是梅林的徒弟。老師留下了一批未公開的筆記與七張象徵牌。圓桌騎士 John 的相關紀錄被後世大幅改寫。</p>
<p>你的任務是讓天平重新平衡，找出被抹去的名字。</p>
<p class="rule">每邊最多放 3 張牌</p>
</div>

<div id="stage">
<svg viewBox="0 0 360 230" role="img" aria-label="天平">
 <g stroke="#8c8a80" fill="none" stroke-width="2">
  <path d="M180 40 V205 M140 205 H220"/>
 </g>
 <g class="beam" id="beam">
  <path d="M60 40 H300" stroke="#b08a4a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="180" cy="40" r="7" fill="#b08a4a"/>
 </g>
 <g class="pan l" id="panL"><path d="M60 40 L25 125 M60 40 L95 125" stroke="#8c8a80" fill="none"/><path d="M15 125 H105 Q60 160 15 125Z" fill="#4f7d73"/></g>
 <g class="pan r" id="panR"><path d="M300 40 L265 125 M300 40 L335 125" stroke="#8c8a80" fill="none"/><path d="M255 125 H345 Q300 160 255 125Z" fill="#8a6a3b"/></g>
</svg>
</div>

<div class="zones">
 <div class="zone" id="zoneL"><h2>左盤　<span class="sum" id="sumL">0</span></h2><div id="zL"></div></div>
 <div class="zone" id="zoneR"><h2>右盤　<span class="sum" id="sumR">0</span></h2><div id="zR"></div></div>
</div>
<div class="pool"><div class="poolhead">牌堆：按「◀ 左」放左盤，按「右 ▶」放右盤；盤裡的牌點一下收回</div><div id="pool"></div></div>
<div class="row"><button class="act" id="reset">重置</button><button class="act main" id="go">讓石板顯影</button></div>
<div class="tablet silent" id="tablet" aria-live="polite">石板沉默著。<br>把牌放上天平。</div>

<div id="admin"><p>後台紀錄（僅此瀏覽器）</p><div class="row"><button class="act" id="exp">匯出 CSV</button><button class="act" id="clr">清空</button></div><table id="logtbl"></table></div>

// ===== 以下為程式 =====
const pos={}; CARDS.forEach(c=>pos[c.id]=0);
const $=id=>document.getElementById(id);
const by=id=>CARDS.find(c=>c.id===id);
const side=k=>CARDS.filter(c=>pos[c.id]===k);
const sum=a=>a.reduce((x,c)=>x+c.v,0);
let tm;

function put(id,k){if(k&&side(k).length>=MAXSIDE)return;pos[id]=k;render();silence()}
function back(c){const b=document.createElement('button');b.className='card';b.innerHTML=c.n+' <span>✕</span>';b.onclick=()=>put(c.id,0);return b}
function row(c){
 const d=document.createElement('div');d.className='prow';
 const l=document.createElement('button');l.className='go l';l.textContent='◀ 左';l.disabled=side(1).length>=MAXSIDE;l.onclick=()=>put(c.id,1);
 const r=document.createElement('button');r.className='go r';r.textContent='右 ▶';r.disabled=side(2).length>=MAXSIDE;r.onclick=()=>put(c.id,2);
 const n=document.createElement('span');n.className='nm';n.innerHTML=c.n+'<span class="ds">'+c.d+'</span>';
 d.append(l,n,r);return d}
function render(){
 const pl=$('pool');pl.innerHTML='';side(0).forEach(c=>pl.appendChild(row(c)));
 [['zL',1],['zR',2]].forEach(([e,k])=>{const el=$(e);el.innerHTML='';side(k).forEach(c=>el.appendChild(back(c)))});
 const L=side(1),R=side(2),ls=sum(L),rs=sum(R);
 $('sumL').textContent=ls;$('sumR').textContent=rs;
 const a=(L.length+R.length)?Math.max(-20,Math.min(20,(rs-ls)*2.2)):0;
 $('beam').style.transform='rotate('+a+'deg)';
 $('panL').style.transform='rotate('+(-a)+'deg)';
 $('panR').style.transform='rotate('+(-a)+'deg)';
 $('stage').className=(ls===rs&&ls>0)?'sway':'';
}
function silence(){clearInterval(tm);const t=$('tablet');t.className='tablet silent';t.innerHTML='石板沉默著。<br>把牌放上天平。'}
function judge(){
 const L=side(1),R=side(2),ls=sum(L),rs=sum(R);
 if(!L.length||!R.length||ls!==rs)return 'chaos';
 return [...L,...R].some(c=>c.id==='sk')?'true':'fake';
}
function addRes(t,S,delay){
 const d=document.createElement('div');d.className='res';d.style.animationDelay=delay+'s';
 const i=document.createElement('img');i.src=S.img;i.alt=S.t;i.loading='lazy';
 const h=document.createElement('p');h.className='hint';h.innerHTML='第二週提示<b>'+S.hint+'</b>';
 d.append(i,h);t.appendChild(d);
}
function show(state){
 clearInterval(tm);const t=$('tablet'),S=STORY[state];
 t.className='tablet '+state;t.innerHTML='<p class="t">'+S.t+'</p>';
 if(state!=='chaos'){S.p.forEach((x,i)=>{const p=document.createElement('p');p.textContent=x;p.style.animationDelay=(i*1.2+.3)+'s';t.appendChild(p)});addRes(t,S,S.p.length*1.2+.6);return}
 t.classList.add('shake');
 const box=document.createElement('div');t.appendChild(box);let n=0;
 const draw=()=>{box.innerHTML='';[...S.frags].sort(()=>Math.random()-.5).slice(0,3).forEach(f=>{const p=document.createElement('p');p.className='frag';p.textContent=f;p.style.marginLeft=Math.floor(Math.random()*40)+'%';box.appendChild(p)})};
 draw();
 tm=setInterval(()=>{n++;if(n>10){clearInterval(tm);t.classList.remove('shake');box.innerHTML='';S.last.forEach(x=>{const p=document.createElement('p');p.textContent=x;box.appendChild(p)});addRes(t,S,.4);return}draw()},320);
}
// ---- 紀錄 ----
const KEY='libra_log';
const getLog=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
function log(state){
 const L=side(1),R=side(2);
 const e={week:WEEK,time:new Date().toISOString(),left:L.map(c=>c.n),right:R.map(c=>c.n),leftSum:sum(L),rightSum:sum(R),state};
 try{const a=getLog();a.push(e);localStorage.setItem(KEY,JSON.stringify(a))}catch(x){}
 if(ENDPOINT){try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(e)})}catch(x){}}
 drawLog();
}
function drawLog(){
 const a=getLog();$('logtbl').innerHTML='<tr><th>時間</th><th>左</th><th>右</th><th>狀態</th></tr>'+a.slice().reverse().map(e=>'<tr><td>'+e.time.slice(5,16).replace('T',' ')+'</td><td>'+e.left.join('+')+'='+e.leftSum+'</td><td>'+e.right.join('+')+'='+e.rightSum+'</td><td>'+e.state+'</td></tr>').join('');
}
$('go').onclick=()=>{if(!side(1).length&&!side(2).length)return;const s=judge();show(s);log(s)};
$('reset').onclick=()=>{CARDS.forEach(c=>pos[c.id]=0);render();silence()};
$('exp').onclick=()=>{const a=getLog();const csv='week,time,left,right,leftSum,rightSum,state\n'+a.map(e=>[e.week,e.time,e.left.join('+'),e.right.join('+'),e.leftSum,e.rightSum,e.state].join(',')).join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='libra_log.csv';l.click()};
$('clr').onclick=()=>{if(confirm('清空此瀏覽器的紀錄？')){localStorage.removeItem(KEY);drawLog()}};
if(location.hash==='#admin'){$('admin').style.display='block';drawLog()}
render();
</script>
